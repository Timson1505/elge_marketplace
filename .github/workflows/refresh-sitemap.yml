name: Refresh SEO pages and sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static SEO product/category pages and sitemap
        env:
          SITE_URL: https://timson1505.github.io/elge_marketplace/
        run: node scripts/generate-sitemap.mjs
      - name: Commit generated pages
        run: |
          if git diff --quiet -- sitemap.xml products categories; then
            echo "SEO pages unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml products categories
          git commit -m "chore: refresh SEO product pages and sitemap"
          git push
